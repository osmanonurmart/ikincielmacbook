<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2+1 Ses Sistemi Testi</title>
<style>
  :root {
    --bg: #111418; --card: #1b2027; --fill: #2f6fed; --text: #e8ecf1; --muted: #8b95a3; --warn: #f0b429;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .warn { color: var(--warn); font-size: 14px; margin: 0 0 16px; }
  .vol { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 14px; color: var(--muted); }
  .vol input { flex: 1; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 0 8px; }
  button.bar {
    position: relative; overflow: hidden; display: block; width: 100%; text-align: left;
    background: var(--card); color: var(--text); border: 0; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 8px; cursor: pointer; font: inherit;
  }
  button.bar .p { position: absolute; inset: 0; width: 0; background: var(--fill); opacity: .35; }
  button.bar .t, button.bar .d { position: relative; display: block; }
  button.bar .t { font-weight: 600; }
  button.bar .d { font-size: 13px; color: var(--muted); margin-top: 2px; }
  button.bar.on { outline: 2px solid var(--fill); }
  .now { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; font-size: 14px; color: var(--muted); min-height: 40px; }
</style>
</head>
<body>
<main>
  <h1>2+1 Ses Sistemi Testi</h1>
  <p class="warn">Sesi kısık başlat, yavaş yavaş aç. Tıkla: çalar. Tekrar tıkla: durur.</p>
  <label class="vol">Ses <input id="vol" type="range" min="0" max="100" value="60"> <span id="volv">60</span></label>
  <div id="list"></div>
  <div class="now" id="now"></div>
</main>
<script>
let ctx, master, current = null;

// iPhone sessiz modda Web Audio'yu susturur. Sesi "medya" gibi çalmaya zorla.
let unlocked = false;
function silentWav() {
  const n = 800, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function unlock() {
  if (unlocked) return; unlocked = true;
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try { const a = new Audio(silentWav()); a.setAttribute('playsinline', ''); a.loop = true; a.play().catch(() => {}); } catch (e) {}
}

function audio() {
  unlock();
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.connect(ctx.destination);
    setVol();
  }
  return ctx.state === 'running' ? Promise.resolve() : ctx.resume();
}
function setVol() {
  const v = +document.getElementById('vol').value;
  document.getElementById('volv').textContent = v;
  if (master) master.gain.setTargetAtTime((v / 100) ** 2, ctx.currentTime, 0.02);
}
document.getElementById('vol').oninput = setVol;

// Tıklama/pop olmaması için yumuşak açılıp kapanan zarf
function env(t0, dur, level = 0.8, fade = 0.05) {
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(level, t0 + fade);
  g.gain.setValueAtTime(level, t0 + dur - fade);
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  return g;
}
// pan: -1 sol, 0 orta, 1 sağ
function out(node, pan = 0) {
  if (pan === 0 || !ctx.createStereoPanner) { node.connect(master); return; }
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  node.connect(p); p.connect(master);
}
function tone(t0, dur, f1, f2 = f1, pan = 0, level = 0.8) {
  const o = ctx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f1, t0);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  const g = env(t0, dur, level);
  o.connect(g); out(g, pan);
  o.start(t0); o.stop(t0 + dur + 0.05);
  return [o];
}
function pinkBuffer(sec) {
  const n = ctx.sampleRate * sec, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < n; i++) {
    const w = Math.random() * 2 - 1;
    b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852;
    b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926;
  }
  return b;
}
function noise(t0, dur, pan = 0, lowpass = 0) {
  const s = ctx.createBufferSource(); s.buffer = pinkBuffer(dur + 0.1);
  let node = s;
  if (lowpass) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lowpass; f.Q.value = 0.7; s.connect(f); node = f; }
  const g = env(t0, dur, lowpass ? 1.6 : 0.8);
  node.connect(g); out(g, pan);
  s.start(t0); s.stop(t0 + dur + 0.05);
  return [s];
}
function kick(t0, f = 55) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.setValueAtTime(150, t0);
  o.frequency.exponentialRampToValueAtTime(f, t0 + 0.08);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(1, t0 + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
  o.connect(g); out(g);
  o.start(t0); o.stop(t0 + 0.5);
  return o;
}

const D = 8; // sabit tonların süresi (sn)
const tests = [
  { g: 'Önce bunu dene' },
  { t: 'Ses kontrolü (bip)', d: 'Her hoparlörden duyulur. Bu da duyulmuyorsa sorun bağlantıda veya cihaz sesinde.', dur: 3,
    run: t => tone(t, 3, 440, 440, 0, 0.5) },
  { g: 'Subwoofer (dip sesler)' },
  { t: 'Dip tarama 20 → 150 Hz', d: 'Yavaşça yükselir. Bir yerde ses kayboluyor, birden patlıyor veya cızırdıyorsa not al.', dur: 20,
    run: t => tone(t, 20, 20, 150) },
  ...[25, 30, 40, 50, 60, 80, 100].map(f => ({
    t: f + ' Hz sabit ton', d: f <= 30 ? 'Çok derin. Duymaktan çok hissedilir.' : 'Uğultu dışında vınlama, tıkırtı, hava sesi olmamalı.',
    dur: D, run: t => tone(t, D, f, f) })),
  { t: 'Titreşim / tıkırtı avı 25 → 70 Hz', d: 'Çok yavaş tarama. Kasa, raf, eşya titreşiyorsa bu sırada duyulur.', dur: 40,
    run: t => tone(t, 40, 25, 70, 0, 0.9) },
  { t: 'Kick davul', d: 'Tok ve kısa olmalı. Uzayan "bum" ya da gecikme kötü.', dur: 8,
    run: t => { const a = []; for (let i = 0; i < 16; i++) a.push(kick(t + i * 0.5)); return a; } },
  { t: 'Dip gürültü (80 Hz altı)', d: 'Düzgün, gürleyen bir uğultu olmalı. Kesilip gelme olmamalı.', dur: 10,
    run: t => noise(t, 10, 0, 80) },

  { g: 'Sub ↔ uydu geçişi' },
  { t: 'Geçiş taraması 50 → 300 Hz', d: 'Ses subdan uydulara geçerken boşluk ya da ani yükselme olmamalı.', dur: 20,
    run: t => tone(t, 20, 50, 300) },
  { t: 'Faz testi: normal', d: 'Önce bunu dinle (60 Hz, iki kanal aynı fazda).', dur: 6,
    run: t => [...tone(t, 6, 60, 60, -1), ...tone(t, 6, 60, 60, 1)] },
  { t: 'Faz testi: ters', d: 'Bu, öncekinden belirgin zayıf duyulmalı. Daha güçlüyse bir hoparlörün + / − kabloları ters.', dur: 6,
    run: t => {
      const a = tone(t, 6, 60, 60, -1);
      const o = ctx.createOscillator(); o.frequency.value = 60;
      const inv = ctx.createGain(); inv.gain.value = -1;
      const g = env(t, 6, 0.8); o.connect(inv); inv.connect(g); out(g, 1);
      o.start(t); o.stop(t + 6.05); return [...a, o];
    } },

  { g: 'Uydu hoparlörler' },
  { t: 'Sadece SOL', d: 'Ses yalnız sol hoparlörden gelmeli.', dur: 5, run: t => noise(t, 5, -1) },
  { t: 'Sadece SAĞ', d: 'Ses yalnız sağ hoparlörden gelmeli.', dur: 5, run: t => noise(t, 5, 1) },
  { t: 'Orta (iki kanal eşit)', d: 'Ses tam ortadan geliyormuş gibi olmalı. Bir tarafa kayıyorsa denge bozuk.', dur: 5, run: t => noise(t, 5, 0) },
  { t: 'Tam aralık tarama 20 Hz → 20 kHz', d: 'Her yerde düzgün olmalı. Cızırtı, tıkırtı, ani kesilme kötü.', dur: 30,
    run: t => tone(t, 30, 20, 20000, 0, 0.6) },
];

const list = document.getElementById('list'), now = document.getElementById('now');
tests.forEach(x => {
  if (x.g) { const h = document.createElement('h2'); h.textContent = x.g; list.appendChild(h); return; }
  const b = document.createElement('button'); b.className = 'bar';
  b.innerHTML = '<span class="p"></span><span class="t"></span><span class="d"></span>';
  b.querySelector('.t').textContent = x.t + '  ·  ' + x.dur + ' sn';
  b.querySelector('.d').textContent = x.d;
  b.onclick = () => {
    const same = current && current.b === b;
    stop();
    if (!same) play(x, b);
  };
  list.appendChild(b);
});

async function play(x, b) {
  try { await audio(); } catch (e) {}
  if (ctx.state !== 'running') { now.textContent = 'Ses başlatılamadı. Sayfayı yenileyip tekrar dene.'; return; }
  const t0 = ctx.currentTime + 0.05;
  const nodes = x.run(t0);
  b.classList.add('on');
  const p = b.querySelector('.p');
  current = { b, nodes, raf: 0 };
  const tick = () => {
    const k = Math.min(1, (ctx.currentTime - t0) / x.dur);
    p.style.width = (k * 100) + '%';
    now.textContent = '▶ ' + x.t + '  ' + Math.max(0, Math.ceil(x.dur - (ctx.currentTime - t0))) + ' sn';
    if (k >= 1) { stop(); return; }
    current.raf = requestAnimationFrame(tick);
  };
  tick();
}
function stop() {
  if (!current) return;
  cancelAnimationFrame(current.raf);
  current.nodes.forEach(n => { try { n.stop(); } catch (e) {} });
  current.b.classList.remove('on');
  current.b.querySelector('.p').style.width = '0';
  current = null;
  now.textContent = '';
}
</script>
</body>
</html>
